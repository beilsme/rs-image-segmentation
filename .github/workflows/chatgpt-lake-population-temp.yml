name: ChatGPT temporary lake population calculation

on:
  pull_request:
    paths:
      - 'chatgpt_lake_population/**'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests shapely geopandas rasterio scipy pyproj
      - name: Verify HydroLAKES ID list
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          ids=[int(x) for x in gzip.decompress(base64.b64decode(Path('chatgpt_lake_population/hylak_ids_3891.txt.gz.b64').read_text())).decode().splitlines() if x.strip()]
          assert len(ids)==3891, len(ids)
          assert len(set(ids))==3891, 'duplicate HydroLAKES IDs'
          print('Verified HydroLAKES IDs:', len(ids))
          PY
      - name: Compute true shoreline population metrics
        run: python chatgpt_lake_population/compute_population_v2.py
      - name: Upload result tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-population-results
          path: chatgpt_lake_population/output/
          retention-days: 3
          if-no-files-found: warn
